## Environment for hardware tier of test_coordinator_integration.py against
## the 'mini2' place on the remote coordinator (10.0.0.41:20408).
##
## Run:
##   LG_COORDINATOR=10.0.0.41:20408 \
##   LG_EXPORTER_HOST=mini2 \
##   LG_EXPORTER_NAME=mini2 \
##   LG_EXPORTER_YAML=examples/lg_ad9081_zcu102_mini2_exporter.yaml \
##   pytest tests/coordinator/test_soc_strat_coordinator.py -v \
##       --run-hardware --lg-config tests/coordinator/env_remote_mini2.yaml

imports:
  - adi_lg_plugins

targets:
  main:
    resources:
      RemotePlace:
        name: mini2
    drivers:
      VesyncPowerDriver: {}
      USBSDMuxDriver: {}
      # Binds USBSDMuxDevice directly; performs full-image writes
      # (BootFPGASoC's optional image_writer, and `adi-lg flash-sd`).
      USBStorageDriver: {}
      SerialDriver: {}
      ADIShellDriver:
        prompt: 'root@.*'
        login_prompt: 'analog login: '
        username: 'root'
        password: 'analog'
      KuiperDLDriver: {}
      MassStorageDriver:
        # By label, not by-partuuid: adi-kuiper-gen generates a fresh MBR
        # signature per build, so a partuuid pin stops resolving after any
        # full-image flash. The FAT label is always BOOT.
        partition: '/dev/disk/by-label/BOOT'
      BootFPGASoC:
        reached_linux_marker: 'analog'
        wait_for_linux_prompt_timeout: 180
        debug_write_boot_log: true
