## Environment for hardware tier of test_coordinator_integration.py.
##
## Binds to the 'bq' place on the remote coordinator (10.0.0.41:20408).
## The exporter on the lab host publishes the underlying resources; the
## drivers run client-side (here) and reach hardware via the network
## wrappers (ser2net, NetworkUSBSDMuxDevice, etc.) or external services
## (Vesync cloud).
##
## Run:
##   LG_CROSSBAR=10.0.0.41:20408 pytest tests/test_coordinator_integration.py \
##       -v --run-hardware --lg-config tests/env_remote_bq.yaml

imports:
  - adi_lg_plugins

targets:
  main:
    resources:
      RemotePlace:
        name: bq
    drivers:
      VesyncPowerDriver: {}
      USBSDMuxDriver: {}
      SerialDriver: {}
      ADIShellDriver:
        prompt: 'root@.*'
        login_prompt: 'analog login: '
        username: 'root'
        password: 'analog'
      KuiperDLDriver: {}
      MassStorageDriver:
        partition: '/dev/disk/by-partuuid/a22286d2-01'
      BootFPGASoC:
        reached_linux_marker: 'analog'
        wait_for_linux_prompt_timeout: 180
        debug_write_boot_log: true
