## Power fragment: VeSync smart plug (vesync), included by the stock exporter
## templates. Generated from adi_lg_plugins/hw_ci/power.py - edit there, then run
## `python -m adi_lg_plugins.hw_ci.power exporter_configs/templates/power`.
  VesyncOutlet:
    cls: VesyncOutlet
    outlet_names: "{{ power_outlet }}"
    username: '{{ env["VESYNC_USERNAME"] }}'
    password: '{{ env["VESYNC_PASSWORD"] }}'
