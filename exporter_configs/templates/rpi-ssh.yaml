## Exporter template: Raspberry Pi driven over SSH
## For Raspberry Pi hosts (CM4, Pi 4, ...) served by BootRPI.
## Comments use "##": labgrid renders this file as Jinja2, where a line starting
## with a single "#" is a template statement.
## Group naming convention: <BOARD>_<VARIANT>
##
## Place tags (required for the hw-matrix dynamic_mode allocator):
## After creating the matching place on the coordinator, set its tags using the
## existing convention `daughter-board=<chip>` plus `carrier=rpi`:
##   labgrid-client -x <coordinator>:20408 -p <place_name> set-tags \
##       daughter-board=rpi_<variant_lower> carrier=rpi
## Optional `runner` tag overrides the GH Actions runner label:
##   labgrid-client -x <coordinator>:20408 -p <place_name> set-tags runner=hw-rpi
## See exporter_configs/scripts/seed-place-tags.sh for a one-shot helper.

RPI_{{ variant | default("CM4") }}:
  NetworkService:
    cls: NetworkService
    address: "{{ target_ip }}"
    username: "{{ username | default('root') }}"
