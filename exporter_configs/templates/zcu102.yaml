# Exporter template: ZCU102 SoC
# Group naming convention: <BOARD>_<CHIP>
#
# Place tags (required for the hw-matrix dynamic_mode allocator):
# After creating the matching place on the coordinator, set its tags:
#   labgrid-client -x <coordinator>:20408 -p <place_name> set-tags \
#       board=<chip_lower> carrier=zcu102
# Substitute <chip_lower> with the lowercased chip name (e.g. ad9081).
# Optional `runner` tag overrides the GH Actions runner label:
#   labgrid-client -x <coordinator>:20408 -p <place_name> set-tags runner=hw-zcu102
# See exporter_configs/scripts/seed-place-tags.sh for a one-shot helper.

{{ exporter_name | default("lab-host-01") }}:
  ZCU102_{{ chip | default("AD9081") }}:
    NetworkService:
      cls: NetworkService
      address: "{{ target_ip }}"
      username: "root"
    RawSerialPort:
      cls: RawSerialPort
      port: "{{ serial_port | default('/dev/ttyUSB0') }}"
      speed: 115200
    USBSDMuxDevice:
      cls: USBSDMuxDevice
      control_path: "{{ sdmux_path | default('/dev/sg0') }}"
