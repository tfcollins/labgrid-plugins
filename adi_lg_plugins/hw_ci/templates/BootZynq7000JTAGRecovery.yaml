# Auto-generated by adi_lg_plugins.hw_ci.render_env for place ${place_name}.
# carrier=${carrier} daughter-board=${daughter_board} hdl-config=${hdl_config}
#
# BootZynq7000JTAGRecovery: Recovery boot for bricked Zynq-7000 boards
# via JTAG. The DUT is brought up with a custom initramfs + recovery
# shell over JTAG; useful for re-flashing broken SD cards.

imports:
  - adi_lg_plugins

targets:
  main:
    resources:
      RemotePlace:
        name: ${place_name}
    drivers:
      ${power_driver}: {}
      XilinxJTAGDriver: {}
      SerialDriver: {}
      # Strategy's `tftp_driver` binding (it TFTPs the recovery kernel).
      TFTPServerDriver: {}
      ADIShellDriver:
        prompt: '/ # '
        login_prompt: ''
        # The recovery initramfs has no login prompt, but ADIShellDriver
        # requires username as an init arg (no default).
        username: 'root'
        password: 'analog'
      BootZynq7000JTAGRecovery:
        wait_for_recovery_prompt_timeout: 240
