# Auto-generated by adi_lg_plugins.hw_ci.render_env for place ${place_name}.
# carrier=${carrier} daughter-board=${daughter_board} hdl-config=${hdl_config}
#
# BootFPGASoCTFTP: SoC boot via U-Boot TFTP. Boot files are served from
# the runner's TFTP root; the DUT pulls them via the serial console.

targets:
  main:
    resources:
      RemotePlace:
        name: ${place_name}
    drivers:
      VesyncPowerDriver: {}
      SerialDriver: {}
      ADIShellDriver:
        prompt: 'root@.*'
        login_prompt: 'analog login: '
        username: 'root'
        password: 'analog'
      KuiperDLDriver: {}
      TFTPServerDriver: {}
      BootFPGASoCTFTP:
        reached_linux_marker: 'analog'
        wait_for_linux_prompt_timeout: 240
