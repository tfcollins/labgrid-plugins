# Auto-generated by adi_lg_plugins.hw_ci.render_env for place ${place_name}.
# carrier=${carrier} daughter-board=${daughter_board} hdl-config=${hdl_config}
#
# BootFPGASoCTFTP: SoC boot via U-Boot TFTP. The TFTP server runs locally
# alongside the test runner (so KuiperDLDriver can write uImage / DTB
# into its root); the DUT pulls them via the serial console.
#
# The local TFTPServerResource is given an explicit name (`local-tftp`)
# and TFTPServerDriver binds to it by name. This avoids
# `multiple resources matching TFTPServerResource` errors when the
# coordinator's exporter ALSO publishes a TFTPServerResource on the
# place (we want our local writable root, not the remote one).
#
# JTAG bootstrap is opt-in: set the place tags `ps7-init-tcl` and
# `uboot-elf` (and optionally `fsbl-elf` / `bitstream-path`) and the
# strategy will xsdb-load U-Boot into DDR before waiting for the
# autoboot banner. Useful when the board's SD doesn't carry a working
# FSBL/U-Boot. When the tags aren't set the substitutions resolve to
# empty strings and the strategy falls through to the SD-bootable path.

imports:
  - adi_lg_plugins

targets:
  main:
    resources:
      RemotePlace:
        name: ${place_name}
      TFTPServerResource:
        name: local-tftp
        address: 'auto'
        port: 3069
        root: ${tftp_root}
    # Expose the place's identity as labgrid features so consumers gating
    # tests with @pytest.mark.lg_feature (e.g. pyadi-dt) select rather than
    # skip. Mirrors coordinator env_gen — keep in sync.
    features:
      - '${daughter_board}'
      - '${carrier}'

    drivers:
      ${power_driver}: {}
      SerialDriver: {}
      XilinxJTAGDriver: {}
      ADIShellDriver:
        prompt: 'root@.*'
        login_prompt: 'analog login: '
        username: 'root'
        password: 'analog'
      KuiperDLDriver: {}
      TFTPServerDriver:
        bindings:
          resource: local-tftp
      BootFPGASoCTFTP:
        bindings:
          tftp_server: local-tftp
        reached_linux_marker: 'analog'
        wait_for_linux_prompt_timeout: 240
        # JTAG bootstrap (optional)
        ps7_init_tcl: '${ps7_init_tcl}'
        uboot_elf: '${uboot_elf}'
        fsbl_elf: '${fsbl_elf}'
        bitstream_path: '${bitstream_path}'
        # SD-autoboot (optional): when 'true', skip the TFTP-kernel boot
        # and let the JTAG-bootstrapped U-Boot autoboot the SD's own
        # Kuiper straight to Linux. Set the place tag `sd-autoboot=true`
        # for JTAG-recovery-class boards whose SD is already imaged.
        sd_autoboot: '${sd_autoboot}'
        # Stable per-place MAC: set via `setenv ethaddr` before `dhcp`
        # on the interactive TFTP path so DHCP leases are predictable
        # (stock Kuiper randomizes the MAC every boot). render_env
        # derives this from the place name; override via the `ethaddr`
        # tag, opt out with `ethaddr=stock` (renders empty → skipped).
        ethaddr: '${ethaddr}'
        # Carrier-aware U-Boot/Linux config (render_env supplies
        # Zynq-7000 vs ZynqMP defaults; override via place tags).
        uboot_prompt: '${uboot_prompt}'
        kernel_image_name: '${kernel_image_name}'
        dtb_image_name: '${dtb_image_name}'
        boot_cmd: '${boot_cmd}'
        kernel_addr: '${kernel_addr}'
        dtb_addr: '${dtb_addr}'
