# Auto-generated by adi_lg_plugins.hw_ci.render_env for place ${place_name}.
# carrier=${carrier} daughter-board=${daughter_board} hdl-config=${hdl_config}
#
# BootFPGASoCSSH: SoC boot, boot files copied to the board over SSH
# (no SD mux involved). For lab setups where the boot media stays in
# the DUT and only the rootfs partition is updated.

imports:
  - adi_lg_plugins

targets:
  main:
    resources:
      RemotePlace:
        name: ${place_name}
    # Expose the place's identity as labgrid features so consumers gating
    # tests with @pytest.mark.lg_feature (e.g. pyadi-dt) select rather than
    # skip. Mirrors coordinator env_gen — keep in sync.
    features:
      - '${daughter_board}'
      - '${carrier}'

    drivers:
      ${power_driver}: {}
      SerialDriver: {}
      ADIShellDriver:
        prompt: 'root@.*'
        login_prompt: 'analog login: '
        username: 'root'
        password: 'analog'
      KuiperDLDriver: {}
      # BootFPGASoCSSH binds an SSHDriver to push updated boot files
      # over the network. Username + password come from the place's
      # NetworkService resource by default.
      SSHDriver: {}
      BootFPGASoCSSH:
        reached_linux_marker: 'analog'
        wait_for_linux_prompt_timeout: 180
