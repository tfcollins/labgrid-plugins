# Auto-generated by adi_lg_plugins.hw_ci.render_env for place ${place_name}.
# carrier=${carrier} daughter-board=${daughter_board} hdl-config=${hdl_config}
#
# BootTickFPGASSH: boot a pre-baked Kuiper SD (reusing the BootFPGASoCSSH
# boot-to-shell machinery), then deploy Tick at runtime over SSH — program
# the FPGA via fpga_manager, apply the DT overlay via configfs, and load the
# axi_timed_command_scheduler kernel module. Fill in the TickArtifacts paths
# with the per-run bitstream / prebuilt .dtbo / .ko before acquiring.

imports:
  - adi_lg_plugins

targets:
  main:
    resources:
      RemotePlace:
        name: ${place_name}
      # Per-run Tick deploy artifacts. Replace these example paths with the
      # bitstream, prebuilt devicetree overlay, and kernel module for the run.
      TickArtifacts:
        bitstream_path: /run/tick/ad9081_fmca_ebz_zcu102.bit
        overlay_dtbo_path: /run/tick/tick.dtbo
        module_ko_path: /run/tick/axi_timed_command_scheduler.ko
    # Expose the place's identity as labgrid features so consumers gating
    # tests with @pytest.mark.lg_feature (e.g. pyadi-dt) select rather than
    # skip. Mirrors coordinator env_gen — keep in sync.
    features:
      - '${daughter_board}'
      - '${carrier}'

    drivers:
      ${power_driver}: {}
      SerialDriver: {}
      ADIShellDriver:
        prompt: 'root@.*'
        login_prompt: 'analog login: '
        username: 'root'
        password: 'analog'
      KuiperDLDriver: {}
      # The Tick deploy drivers bind the CommandProtocol + FileTransferProtocol
      # pair; SSHDriver satisfies both for the runtime fpga/overlay/module steps.
      SSHDriver: {}
      TickFpgaManagerDriver: {}
      TickOverlayDriver: {}
      TickModuleDriver: {}
      BootTickFPGASSH:
        reached_linux_marker: 'analog'
        wait_for_linux_prompt_timeout: 180
