# Auto-generated by adi_lg_plugins.hw_ci.render_env for place ${place_name}.
# carrier=${carrier} daughter-board=${daughter_board} hdl-config=${hdl_config}
#
# BootRPI: Raspberry Pi-based runner. The DUT is the RPi itself; tests
# reach it primarily via SSH. Power control via Vesync outlet keeps the
# board cleanly resettable. Serial is optional but recommended.

imports:
  - adi_lg_plugins

targets:
  main:
    resources:
      RemotePlace:
        name: ${place_name}
    # Expose the place's identity as labgrid features so consumers gating
    # tests with @pytest.mark.lg_feature (e.g. pyadi-dt) select rather than
    # skip. Mirrors coordinator env_gen — keep in sync.
    features:
      - '${daughter_board}'
      - '${carrier}'

    drivers:
      ${power_driver}: {}
      SSHDriver:
        username: 'analog'
      SerialDriver: {}
      ADIShellDriver:
        prompt: 'analog@.*'
        login_prompt: 'analog login: '
        username: 'analog'
        password: 'analog'
      BootRPI: {}
