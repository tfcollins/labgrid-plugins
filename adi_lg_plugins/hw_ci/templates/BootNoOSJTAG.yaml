# Auto-generated by adi_lg_plugins.hw_ci.render_env for place ${place_name}.
# carrier=${carrier} daughter-board=${daughter_board} hdl-config=${hdl_config}
#
# BootNoOSJTAG: flash + run a no-os bare-metal firmware ELF via JTAG (no Linux,
# no SD). xsdb loads the FPGA bitstream + ps7_init and downloads the no-os .elf,
# then validates a serial banner. The per-build paths (firmware_elf, bitstream,
# ps7_init) are injected by `adi-lg request --mode flash`; defaults are empty.

imports:
  - adi_lg_plugins

targets:
  main:
    resources:
      RemotePlace:
        name: ${place_name}
    drivers:
      ${power_driver}: {}
      XilinxJTAGDriver: {}
      SerialDriver: {}
      ADIShellDriver:
        # no-os has no login/prompt — the console is only read for the banner.
        prompt: ''
        login_prompt: ''
        username: 'root'
        password: 'analog'
      BootNoOSJTAG:
        firmware_elf: '${firmware_elf}'
        bitstream_path: '${bitstream_path}'
        ps7_init_tcl: '${ps7_init_tcl}'
        boot_marker: '${boot_marker}'
        a9_target_name: '${a9_target_name}'
