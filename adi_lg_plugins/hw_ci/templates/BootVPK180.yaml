# Auto-generated by adi_lg_plugins.hw_ci.render_env for place ${place_name}.
# carrier=${carrier} daughter-board=${daughter_board} hdl-config=${hdl_config}
#
# BootVPK180: Xilinx VPK180 Versal eval board. Combines JTAG fabric load
# with serial-driven u-boot + Linux boot, similar to BootFPGASoC but
# specific to the VPK180's BOOT.BIN layout.

targets:
  main:
    resources:
      RemotePlace:
        name: ${place_name}
    drivers:
      ${power_driver}: {}
      SerialDriver: {}
      XilinxJTAGDriver: {}
      ADIShellDriver:
        prompt: 'root@.*'
        login_prompt: 'login: '
        username: 'root'
        password: 'root'
      BootVPK180:
        reached_linux_marker: 'root@'
        wait_for_linux_prompt_timeout: 240
