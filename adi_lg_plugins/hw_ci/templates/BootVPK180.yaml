# Auto-generated by adi_lg_plugins.hw_ci.render_env for place ${place_name}.
# carrier=${carrier} daughter-board=${daughter_board} hdl-config=${hdl_config}
#
# BootVPK180: AMD Versal VPK180 with a Zynq system controller (SC). The place
# exports two consoles, named by convention in the exporter yaml:
#   sc-port      -> SC UART (FT4232H interface 3)
#   target-port  -> Versal UART0 (FT4232H interface 1)
# The board is never power-cycled: the SC restarts the Versal
# (sc_app -c reset), and every BootVPK180 retry re-runs the SC commands.
# With a `power-driver` place tag the outlet is only switched on before a
# boot and off at powered_off (after halting Versal Linux): power_cycle=false.
# Without the tag there is no power driver at all (SC-reset only).
# The Versal boots whatever Kuiper is on its SD card (update_boot_files off).
#
# Place tags: sc-prompt / sc-username / sc-password override the SC login
# (defaults match the stock VPK180 SC PetaLinux); power-driver opts in the
# outlet (e.g. HomeAssistantPowerDriver).

imports:
  - adi_lg_plugins

targets:
  main:
    resources:
      RemotePlace:
        name: ${place_name}
    # Expose the place's identity as labgrid features so consumers gating
    # tests with @pytest.mark.lg_feature (e.g. pyadi-dt) select rather than
    # skip. Mirrors coordinator env_gen — keep in sync.
    features:
      - '${daughter_board}'
      - '${carrier}'

    # Named drivers need labgrid's list form; the DUT shell is named
    # `target_shell` so get_dut_shell() can find it among two shells.
    drivers:
      - SerialDriver:
          name: sc-console
          bindings:
            port: sc-port
      - ADIShellDriver:
          name: sc_shell
          bindings:
            console: sc-console
          prompt: '${sc_prompt}'
          login_prompt: 'login: '
          username: '${sc_username}'
          password: '${sc_password}'
          # The SC needs a few minutes to boot after the outlet switches on.
          login_timeout: 300
      - SerialDriver:
          name: target-console
          bindings:
            port: target-port
      - ADIShellDriver:
          name: target_shell
          bindings:
            console: target-console
          prompt: 'root@.*# '
          login_prompt: 'login: '
          username: root
          password: analog
          login_timeout: 120
      ${power_driver_item}
      - BootVPK180:
          bindings:
            sc_shell: sc_shell
            target_shell: target_shell
          sc_commands:
            - sc_app -c setbootmode -t SD
            - sc_app -c reset
          kernel_banner_pattern: 'Starting kernel'
          # Kuiper's Versal boot.scr sleeps 40 s before loading the kernel.
          wait_for_kernel_banner_timeout: 180
          reached_linux_marker: 'login: '
          wait_for_linux_prompt_timeout: 240
          update_boot_files: false
          power_cycle: false
