# Auto-generated by adi_lg_plugins.hw_ci.render_env for place ${place_name}.
# carrier=${carrier} daughter-board=${daughter_board} hdl-config=${hdl_config}
#
# BootFabric: JTAG-only fabric boot for logic-only Xilinx FPGAs (e.g.
# VCU118 / MicroBlaze). No Linux on the DUT; tests interact via the
# AXI bridge over JTAG (XilinxJTAGDriver) and optionally a UART
# console. Power control is optional.
#
# The ADIShellDriver login config and the BootFabric strategy attrs mirror
# the coordinator's env-gen (coordinator/api/app/env_gen.py: SHELL_DEFAULTS
# and STRATEGY_CONFIGS "BootFabric") — the proven config the old CI booted
# daq3/vcu118 with. Keep the two in sync.

imports:
  - adi_lg_plugins

targets:
  main:
    resources:
      RemotePlace:
        name: ${place_name}
    drivers:
      XilinxJTAGDriver: {}
      ${power_driver}: {}
      SerialDriver: {}
      ADIShellDriver:
        prompt: "#.*"
        login_prompt: "buildroot login: "
        username: "root"
        password: "analog"
      BootFabric:
        reached_boot_marker: "login:"
        trigger_dhcp_reset: true
        wait_for_boot_timeout: 700
        power_off_delay: 30
