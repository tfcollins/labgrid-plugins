# Auto-generated by adi_lg_plugins.hw_ci.render_env for place ${place_name}.
# carrier=${carrier} daughter-board=${daughter_board} hdl-config=${hdl_config}
#
# BootZynqMPJTAG: JTAG boot for UltraScale+ (ZynqMP) boards via the Xilinx
# "mini" U-Boot SPL (EL3, no ATF / no PMU-FW). The DUT is brought up over
# JTAG far enough to own the SD host controller; useful for re-flashing
# broken SD cards. DCC/JTAG-UART console is captured via xsdb.
#
# Caller must set psu_init_tcl + spl_elf (and optional bitstream_path) to
# paths readable by the host that runs xsdb. See
# examples/ultrascale_jtag_boot/ for how to build the mini SPL.

imports:
  - adi_lg_plugins

targets:
  main:
    resources:
      RemotePlace:
        name: ${place_name}
    # Expose the place's identity as labgrid features so consumers gating
    # tests with @pytest.mark.lg_feature (e.g. pyadi-dt) select rather than
    # skip. Mirrors coordinator env_gen — keep in sync.
    features:
      - '${daughter_board}'
      - '${carrier}'

    drivers:
      ${power_driver}: {}
      XilinxJTAGDriver: {}
      SerialDriver: {}
      ADIShellDriver:
        prompt: 'root@[^:]+:[^ ]+[#] '
        login_prompt: 'login:'
        username: 'root'
      BootZynqMPJTAG:
        # Paths on the exporter host that runs xsdb (fill in per bench).
        psu_init_tcl: '/tmp/recovery/psu_init.tcl'
        spl_elf: '/tmp/recovery/u-boot-spl'
        # Optional production handoff after repairing the SD. Uncomment all
        # required payloads before transition("production_boot").
        # pmufw_bin: '/tmp/recovery/production/pmufw.bin'
        # uboot_bin: '/tmp/recovery/production/u-boot.bin'
        # bl31_bin: '/tmp/recovery/production/bl31.bin'
        # atf_handoff_bin: '/tmp/recovery/production/atf-handoff.bin'
        # pm_config_bin: '/tmp/recovery/production/pm-config-object.bin'
        # ddr_scrub_elf: '/tmp/recovery/ddr-ecc-scrub.elf'
        # Direct-JTAG RAM recovery Linux (transition "recovery_linux"):
        # recovery_trampoline_elf: '/tmp/recovery/el3-to-el2.elf'
        # recovery_kernel_image: '/tmp/recovery/Image-recovery'
        # recovery_initramfs: '/tmp/recovery/initramfs.cpio.gz'
        # recovery_dtb: '/tmp/recovery/system-recovery.dtb'
        # Recovery uses its low-bank scrubber and board-specific SD reset.
        # recovery_ddr_scrub_elf: '/tmp/recovery/ddr-ecc-scrub-low-2g.elf'
        # recovery_ddr_scrub_done_address: '0xFFFC002C'
        # recovery_bitstream_path: '/tmp/recovery/system_top.bit'
        # recovery_post_init_mask_writes:
        #   - ['0xFF5E0238', '0x00000002', '0x00000000']
        # Destructive flash state additionally requires sd_image_url,
        # sd_image_size, sd_head_sha256, and sd_tail_sha256.
        # sd_image_url: 'http://IMAGE_SERVER/kuiper-full.img'
        # sd_image_size: 10305404928
        # sd_head_sha256: '...'
        # sd_tail_sha256: '...'
        # Optional PL bitstream, programmed before psu_init.
        # bitstream_path: '/tmp/recovery/system_top.bit'
        # 0x380E releases A53 #0 only (generated ZU11EG value); 0x0 = all A53s.
        apu_release_rst_value: '0x380E'
        a53_target_name: '*Cortex-A53*#0*'
        # Capture the mini-SPL DCC console (headless).
        dcc_log_path: '/tmp/zynqmp-mini-dcc.log'
        spl_settle_ms: 12000
