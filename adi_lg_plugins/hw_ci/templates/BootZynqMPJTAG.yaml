# Auto-generated by adi_lg_plugins.hw_ci.render_env for place ${place_name}.
# carrier=${carrier} daughter-board=${daughter_board} hdl-config=${hdl_config}
#
# BootZynqMPJTAG: production boot for JTAG-strapped UltraScale+ (ZynqMP)
# boards — e.g. the ADRV9009-ZU11EG on ADRV2CRR-FMC (place `tron`), whose
# mode straps are fixed to JTAG. xsdb wakes the PMU ROM with the production
# PMUFW payload, optionally programs the PL, and enters production U-Boot
# through BL31 + the XLNX handoff; the strategy then drives U-Boot's SD
# path into a Kuiper shell. transition("shell") (the fleet-wide
# booted-Linux alias for this strategy's kuiper_shell) therefore works with
# the generic hardware-request flow.
#
# Boot payloads live under the `recovery-root` place tag (default
# /tmp/recovery) at CANONICAL names on the exporter host that runs xsdb:
#   psu_init.tcl  spl.elf  pmufw.bin  u-boot.bin  handoff.bin  bl31.bin
#   atf-handoff.bin  pm-config.bin  ddr-scrub.elf
# Extract/build them with examples/ultrascale_jtag_boot/
# (prepare-production-boot.py + build-mini-uboot.sh + build-recovery-uboot.sh).
# The PL bitstream is per-place via the `bitstream-path` tag (empty = skip).
#
# These paths are on the EXPORTER, so they carry the driver's `exporter:` prefix:
# without it XilinxJTAGDriver stages any file that also exists at the same path
# on the client (e.g. an older copy of the recovery directory on the runner)
# instead of the exporter's own payload.

imports:
  - adi_lg_plugins

targets:
  main:
    resources:
      RemotePlace:
        name: ${place_name}
    # Expose the place's identity as labgrid features so consumers gating
    # tests with @pytest.mark.lg_feature (e.g. pyadi-dt) select rather than
    # skip. Mirrors coordinator env_gen — keep in sync.
    features:
      - '${daughter_board}'
      - '${carrier}'

    drivers:
      ${power_output_driver}
      ${power_driver}: {}
      XilinxJTAGDriver: {}
      SerialDriver: {}
      ADIShellDriver:
        prompt: 'root@.*[#$$]'
        login_prompt: '(analog|zu11eg-recovery) login: ?'
        username: 'root'
        password: 'analog'
      BootZynqMPJTAG:
        # JTAG bootstrap inputs (paths on the host that runs xsdb).
        psu_init_tcl: 'exporter:${recovery_root}/psu_init.tcl'
        spl_elf: 'exporter:${recovery_root}/spl.elf'
        # Production handoff payloads (see prepare-production-boot.py).
        pmufw_bin: 'exporter:${recovery_root}/pmufw.bin'
        uboot_bin: 'exporter:${recovery_root}/u-boot.bin'
        handoff_bin: 'exporter:${recovery_root}/handoff.bin'
        bl31_bin: 'exporter:${recovery_root}/bl31.bin'
        atf_handoff_bin: 'exporter:${recovery_root}/atf-handoff.bin'
        pm_config_bin: 'exporter:${recovery_root}/pm-config.bin'
        # BL31 in the ADI production image logs on UART0 even when the
        # external console is UART1 — initialize it (generic ZynqMP UART0 /
        # CRL_APB register addresses).
        bl31_console_uart_base: '0xFF000000'
        bl31_console_ref_ctrl_address: '0xFF5E0074'
        bl31_console_reset_mask: '0x2'
        # Optional PL bitstream, programmed at the xsdb `fpga` step before
        # psu_init (`bitstream-path` place tag; raw .bit works).
        bitstream_path: '${exporter_bitstream_path}'
        # Full-bank DDR ECC scrubber (psu_init enables ECC uninitialized).
        ddr_scrub_elf: 'exporter:${recovery_root}/ddr-scrub.elf'
        ddr_scrub_done_address: '0xFFFC0054'
        ddr_scrub_settle_ms: 120000
        # 0x380E releases A53 #0 only (generated ZU11EG value); 0x0 = all A53s.
        apu_release_rst_value: '0x380E'
        a53_target_name: '*Cortex-A53*#0*'
        # xsdb runs on the exporter via RemoteExecMixin, so the hw_server
        # endpoint is exporter-local; override with the `jtag-url` tag.
        jtag_url: '${jtag_url}'
        # Boot mode override (`boot-mode-override` place tag; empty = switches).
        # `sd1-ls` makes transition("shell") boot the SD card's own image
        # instead of the JTAG production chain; `jtag` forces JTAG boot mode
        # before the JTAG flows on a board strapped for SD.
        boot_mode: '${boot_mode_override}'
        # Serial quirks (per-place tags; empty = labgrid defaults). ser2net
        # benches whose rfc2217 hangs pyserial's 'purge' negotiation set
        # `serial-protocol-override=raw`; benches whose coordinator-advertised
        # serial host doesn't resolve from the runner set
        # `serial-host-override=<host>.local`.
        serial_host_override: '${serial_host_override}'
        serial_protocol_override: '${serial_protocol_override}'
        # Capture the mini-SPL DCC console (headless).
        dcc_log_path: '/tmp/zynqmp-mini-dcc.log'
        spl_settle_ms: 12000
        production_settle_ms: 15000
        pmufw_timeout_ms: 10000
        power_off_settle_s: 5
        power_on_settle_s: 8
        kuiper_boot_timeout: 600
        sd_boot_command: '${sd_boot_command}'
        # Direct-JTAG RAM recovery Linux (transition "recovery_linux") and the
        # destructive SD reflash are opt-in — uncomment and stage the extra
        # payloads before using those states.
        # recovery_trampoline_elf: 'exporter:${recovery_root}/el3-to-el2.elf'
        # recovery_kernel_image: 'exporter:${recovery_root}/Image-recovery'
        # recovery_initramfs: 'exporter:${recovery_root}/initramfs.cpio.gz'
        # recovery_dtb: 'exporter:${recovery_root}/system-recovery.dtb'
        # recovery_ddr_scrub_elf: 'exporter:${recovery_root}/ddr-ecc-scrub-low-2g.elf'
        # recovery_ddr_scrub_done_address: '0xFFFC002C'
        # recovery_bitstream_path: 'exporter:${recovery_root}/system_top.bit'
        # recovery_post_init_mask_writes:
        #   - ['0xFF5E0238', '0x00000002', '0x00000000']
        # sd_image_url: 'http://IMAGE_SERVER/kuiper-full.img'
        # sd_image_size: 10305404928
        # sd_head_sha256: '...'
        # sd_tail_sha256: '...'
