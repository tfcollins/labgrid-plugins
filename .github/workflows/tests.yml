name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-labgrid-pin:
    name: labgrid fork pin drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify pins are SHA-pinned and agree
        run: |
          set -euo pipefail
          extract() { grep -oP 'tfcollins/labgrid\.git@\K[^"]+' "$1" || true; }
          TOP=$(extract pyproject.toml)
          SUB=$(extract coordinator/api/pyproject.toml)
          if [ -z "$TOP" ] || [ -z "$SUB" ]; then
            echo "::error::Could not find labgrid pin in one or both pyproject.toml files"
            echo "  top=$TOP"
            echo "  sub=$SUB"
            exit 1
          fi
          if [ "$TOP" != "$SUB" ]; then
            echo "::error::labgrid pin drift between pyproject.toml and coordinator/api/pyproject.toml"
            echo "  top=$TOP"
            echo "  sub=$SUB"
            echo "Run scripts/bump-labgrid.sh <sha> to realign."
            exit 1
          fi
          if ! echo "$TOP" | grep -Eq '^[a-f0-9]{40}$'; then
            echo "::error::labgrid pin must be a 40-char SHA, not a branch or tag ref"
            echo "  got: $TOP"
            echo "Run scripts/bump-labgrid.sh <sha> to repin."
            exit 1
          fi
          echo "labgrid pin OK: $TOP"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install nox and uv
      run: |
        python -m pip install --upgrade pip
        pip install nox uv

    - name: Lint with nox
      run: nox -s lint

    - name: Type-check with nox (informational)
      continue-on-error: true
      run: nox -s typecheck

    - name: Install uboot-tools (mkimage) for recovery-module tests
      run: sudo apt-get install -y --no-install-recommends u-boot-tools

    - name: Run tests with nox
      run: |
        # Only run unit tests that don't require hardware or large downloads
        nox -s tests -- \
          tests/test_cli.py \
          tests/test_mcp.py \
          tests/test_vpk180_strat.py \
          tests/test_vpk180_reflash_strat.py \
          tests/test_xilinx_jtag_driver_zynq.py \
          tests/test_zynq7000_recovery_strat.py \
          tests/test_recovery_module.py \
          tests/test_recovery_busybox_http.py \
          tests/test_discover_places.py \
          tests/test_bootfpgasocssh_helpers.py \
          tests/hw_ci/test_resolve.py \
          tests/test_cloudsmith_dl.py
