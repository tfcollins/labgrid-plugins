name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install nox and uv
      run: |
        python -m pip install --upgrade pip
        pip install nox uv

    - name: Lint with nox
      run: nox -s lint

    - name: Type-check with nox (informational)
      continue-on-error: true
      run: nox -s typecheck

    - name: Install uboot-tools (mkimage) for recovery-module tests
      run: sudo apt-get install -y --no-install-recommends u-boot-tools

    - name: Run tests with nox
      run: |
        # Only run unit tests that don't require hardware or large downloads
        nox -s tests -- \
          tests/test_cli.py \
          tests/test_mcp.py \
          tests/test_vpk180_strat.py \
          tests/test_vpk180_reflash_strat.py \
          tests/test_xilinx_jtag_driver_zynq.py \
          tests/test_remote_exec.py \
          tests/test_massstorage_driver.py \
          tests/test_zynq7000_recovery_strat.py \
          tests/test_recovery_module.py \
          tests/test_recovery_busybox_http.py \
          tests/test_discover_places.py \
          tests/test_bootfpgasocssh_helpers.py \
          tests/test_bootfpgasoctftp_sd_autoboot.py \
          tests/hw_ci/test_resolve.py \
          tests/hw_ci/test_markers_ast.py \
          tests/hw_ci/test_markers_rejections.py \
          tests/hw_ci/test_lint_markers_cli.py \
          tests/test_cloudsmith_dl.py \
          tests/test_plugin_registration.py \
          tests/test_request_errors.py \
          tests/test_request_uri.py \
          tests/test_request_match_client.py \
          tests/test_request_reservation.py \
          tests/test_request_core.py \
          tests/test_request_public_api.py \
          tests/test_request_cli.py \
          tests/hw_ci/test_request_cli_annotations.py \
          tests/test_provision.py \
          tests/test_pytest_fixtures.py \
          tests/hw_ci/test_request_matrix.py \
          tests/hw_ci/test_markers_resolve_vars.py \
          tests/hw_ci/test_noos_matrix.py \
          tests/test_bootnoosjtag_strat.py \
          tests/hw_ci/test_render_env.py \
          tests/hw_ci/test_kuiper_xsa.py \
          tests/hw_ci/test_build_noos.py \
          tests/hw_ci/test_noos_manifest.py \
          tests/hw_ci/test_coordinator_resolve_api.py \
          tests/hw_ci/test_release_pin.py \
          tests/hw_ci/test_pin_lint.py \
          tests/hw_ci/test_release_guard.py \
          tests/hw_ci/test_onboarding_templates_packaged.py \
          tests/hw_ci/test_scaffold.py \
          tests/hw_ci/test_init_cli.py \
          tests/hw_ci/test_emit_matrix.py \
          tests/hw_ci/test_fetch_xsa_cli.py \
          tests/hw_ci/test_build_noos_cli.py \
          tests/hw_ci/test_board_map.py \
          tests/hw_ci/test_matlab_matrix.py \
          tests/hw_ci/test_matlab_matrix_cli.py \
          tests/hw_ci/test_all_places.py \
          tests/hw_ci/test_boot_junit.py \
          tests/hw_ci/test_all_places_cli.py \
          tests/hw_ci/test_schema.py \
          tests/hw_ci/test_prism_upload.py \
          tests/hw_ci/test_workflow_var_guard.py \
          tests/hw_ci/test_doctor_core.py \
          tests/hw_ci/test_doctor_gh.py \
          tests/test_kuiperdl_download_image.py \
          tests/test_kasa.py \
          tests/test_pin_release_refs.py

  coordinator-api:
    # The coordinator FastAPI subproject has its own pyproject + test suite
    # (board catalog, /match, /catalog, etc.) and is not picked up by the
    # top-level nox tests session.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coordinator/api
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install coordinator API + dev deps
      run: pip install -e ".[dev]"

    - name: Run coordinator API tests
      run: python -m pytest tests/ -q
