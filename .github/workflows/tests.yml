name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install nox
      run: |
        python -m pip install --upgrade pip
        pip install nox

    - name: Lint with nox
      run: nox -s lint

    - name: Run tests with nox
      run: |
        # Only run unit tests that don't require hardware or large downloads
        nox -s tests -- tests/test_cli.py tests/test_mcp.py
