name: no-os HW Request (low-config flash)

# Reusable workflow: build a no-os reference project, JTAG-flash it onto a
# matching physical board via labgrid, validate it on-target (serial banner),
# and release the board — one independent job per project.
#
# Discovery: the preflight runs `adi-lg-hw-ci noos-matrix`, intersecting the
# consumer's project manifest (noos_project -> part/carriers) with the
# coordinator's live FLASH-capable boards (GET /api/match?mode=flash). A project
# with no live board is annotated + skipped.
#
# Per leg: `adi-lg-hw-ci build-noos` sources the board's .xsa from the Kuiper
# image (no NOOS_XSA_DIR required), composes the Vivado + libtinfo-shim env,
# and runs make — the runner only needs Vivado installed. The resulting .elf +
# bitstream are then flashed via `adi-lg request --mode flash`.

on:
  workflow_call:
    inputs:
      coordinator:
        description: "gRPC coordinator host:port (e.g. host:20408); the REST API (:8000) is derived automatically."
        required: true
        type: string
      manifest:
        description: "Path (in the consumer checkout) to the no-os hw-ci projects.yaml."
        type: string
        default: "tools/hw_ci/projects.yaml"
      runner-label:
        description: >-
          Fallback self-hosted runner label for the per-project legs. Each leg
          prefers the runner co-located with its board (matrix.runner, from the
          place's `runner` tag); this is the fallback. The runner must have
          Vivado/xsdb and reach the board's JTAG.
        type: string
        default: "hw-lab"
      preflight-runner-label:
        description: "Runner label for the discovery preflight (must reach the REST API)."
        type: string
        default: "hw-coordinator"
      build-cmd:
        description: >-
          Shell command to build a project (cwd = consumer checkout). Receives
          $NOOS_PROJECT, $CARRIER, $BOARD, $RELEASE, and $VALIDATE_BANNER.
          Default delegates to `adi-lg-hw-ci build-noos`, which sources Vivado,
          ensures the libtinfo shim, fetches the board's .xsa from the Kuiper
          image, and runs make — the runner only needs Vivado installed; no
          NOOS_XSA_DIR or shim pre-provisioning required. Override this input
          when a DUT needs extra make vars (build_vars forwarding is a future
          enhancement).
        type: string
        default: |
          adi-lg-hw-ci build-noos \
            --project "$NOOS_PROJECT" \
            --carrier "$CARRIER" \
            --board "$BOARD" \
            --release "$RELEASE" \
            --xsa-dir "$XSA_DIR" \
            --validate "$VALIDATE_BANNER"
      firmware-path:
        description: "Built .elf path template ($NOOS_PROJECT expanded)."
        type: string
        default: "projects/$NOOS_PROJECT/build/$NOOS_PROJECT.elf"
      bitstream-path:
        description: >-
          FPGA bitstream path to flash before the .elf ($NOOS_PROJECT expanded).
          Defaults to build-noos's bitstream output location.
        type: string
        default: "projects/$NOOS_PROJECT/build_hw/system_top.bit"
      ps7-init-path:
        description: >-
          ps7_init.tcl path for PS init ($NOOS_PROJECT expanded).
          Defaults to build-noos's ps7_init output location.
        type: string
        default: "projects/$NOOS_PROJECT/build_hw/ps7_init.tcl"
      validate-banner:
        description: >-
          Fallback serial banner asserted on-target after flashing (used when
          matrix.validate_banner is empty). Each matrix leg uses its own
          manifest-declared banner; override this input only as a global default.
        type: string
        default: "Successfully initialized"
      wait:
        description: "Seconds each leg queues for a free matching board (0 = fail fast)."
        type: number
        default: 1800
      venv-dir:
        description: "Absolute path for the persistent uv venv on the runner."
        type: string
        default: "$HOME/.cache/noos-hw-request/venv"
      install-cmd:
        description: >-
          Shell command (run with $VENV_DIR exported) to install adi-labgrid-plugins
          into the per-leg venv. Override per repo if the consumer needs extras.
          The default installs the `kuiper` extra (pytsk3) because `build-noos`
          reads the board's .xsa from the Kuiper image's FAT partition via
          IMGFileExtractor — note pytsk3 is sdist-only and needs the SleuthKit
          dev libs + a C toolchain on the runner to build.
        type: string
        default: >-
          uv pip install --quiet --python "$VENV_DIR/bin/python"
          "adi-labgrid-plugins[kuiper] @ git+https://github.com/tfcollins/labgrid-plugins@main"

jobs:
  preflight:
    runs-on: [self-hosted, "${{ inputs.preflight-runner-label }}"]
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Validate required inputs
        run: |
          [ -n "${{ inputs.coordinator }}" ] || { echo "::error::coordinator is empty — set vars.LG_COORDINATOR (gRPC :20408)"; exit 1; }
          [ -n "${{ inputs.runner-label }}" ] || { echo "::error::runner-label is empty — set vars.HW_REQUEST_RUNNER"; exit 1; }
      - uses: actions/checkout@v4
      - uses: tfcollins/labgrid-plugins/.github/actions/setup-uv-venv@main
        with:
          venv_dir: ${{ inputs.venv-dir }}
          install_cmd: >-
            uv pip install --quiet --python "$VENV_DIR/bin/python"
            "adi-labgrid-plugins[kuiper] @ git+https://github.com/tfcollins/labgrid-plugins@main"
      - id: plan
        env:
          LG_COORDINATOR: ${{ inputs.coordinator }}
        run: |
          adi-lg-hw-ci noos-matrix \
            --manifest "${{ inputs.manifest }}" \
            --coord "${{ inputs.coordinator }}" \
            --github-output

  noos-hw-request:
    needs: preflight
    if: ${{ fromJSON(needs.preflight.outputs.count) > 0 }}
    # Land each leg on the runner co-located with its board's JTAG + Vivado.
    runs-on: [self-hosted, "${{ matrix.runner || inputs.runner-label }}"]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    env:
      LG_COORDINATOR: ${{ inputs.coordinator }}
      NOOS_PROJECT: ${{ matrix.noos_project }}
      CARRIER: ${{ matrix.carrier }}
      BOARD: ${{ matrix.board }}
      RELEASE: ${{ matrix.release }}
      # Optional catalog override (flash.kuiper_xsa_dir) pinning the board's
      # Kuiper boot folder; empty = build-noos searches *<carrier>*<board>*.
      XSA_DIR: ${{ matrix.kuiper_xsa_dir }}
      VALIDATE_BANNER: ${{ matrix.validate_banner || inputs.validate-banner }}
    steps:
      - uses: actions/checkout@v4
      - uses: tfcollins/labgrid-plugins/.github/actions/setup-uv-venv@main
        with:
          venv_dir: ${{ inputs.venv-dir }}
          install_cmd: ${{ inputs.install-cmd }}
      - name: Build ${{ matrix.noos_project }} (${{ matrix.carrier }})
        run: |
          set -euo pipefail
          ${{ inputs.build-cmd }}
      - name: Flash + validate ${{ matrix.part }} (no-os)
        run: |
          set -euo pipefail
          FW="$(eval echo "${{ inputs.firmware-path }}")"
          ARGS=(--part "${{ matrix.part }}" --carrier "${{ matrix.carrier }}" \
                --mode flash --firmware "$FW" --wait "${{ inputs.wait }}" \
                --validate "${{ matrix.validate_banner || inputs.validate-banner }}")
          if [ -n "${{ inputs.bitstream-path }}" ]; then
            ARGS+=(--bitstream "$(eval echo "${{ inputs.bitstream-path }}")")
          fi
          if [ -n "${{ inputs.ps7-init-path }}" ]; then
            ARGS+=(--ps7-init "$(eval echo "${{ inputs.ps7-init-path }}")")
          fi
          adi-lg request "${ARGS[@]}"
