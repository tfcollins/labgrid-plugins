name: HW matrix v2 (reusable, discovery-driven)

# DEPRECATED — do not use for new consumers. Use hw-request.yml@v3.5 instead.
# See docs/source/user-guide/onboarding-a-consumer-repo.rst.

# Reusable workflow consumed by per-repo callers. Unlike v1 (which is
# manifest-first), v2 discovers live hardware from the coordinator's
# /api/places endpoint and intersects it with the caller's pytest
# markers (@pytest.mark.iio_hardware and @pytest.mark.iio_carrier).
#
# Caller projects ship NO `.github/hw-nodes.json` and NO per-place
# `env_remote_*.yaml`. The env yaml is rendered per-shard from the
# place's `boot-strategy` tag against templates in
# adi_lg_plugins/hw_ci/templates/.
#
# See docs/source/user-guide/hw-ci-v2.md for the consumer contract.

on:
  workflow_call:
    inputs:
      coordinator:
        type: string
        required: false
        default: ""
        description: >-
          Coordinator host:port. Defaults to vars.ADI_LG_COORDINATOR
          when empty.
      marker_filter:
        type: string
        required: false
        default: "iio_hardware"
        description: >-
          Top-level pytest marker used to harvest test → hardware
          affinity. Non-iio projects can swap this out.
      test_root:
        type: string
        required: false
        default: "."
        description: Path (relative to repo root) for `pytest --collect-only`.
      venv_install_cmd:
        type: string
        required: true
        description: >-
          Shell command run with $VENV_DIR exported, installing the caller's
          test deps PLUS adi-labgrid-plugins (so the marker plugin is
          available during the discover step).
      venv_dir:
        type: string
        required: false
        default: "$HOME/.cache/hw-ci/venv"
      pre_pytest_cmd:
        type: string
        required: false
        default: ""
        description: >-
          Optional command run inside each shard before pytest. Use for
          cmake builds, fixture pre-staging, etc.
      pytest_cmd_template:
        type: string
        required: true
        description: >-
          Shell command run in each shard. The workflow exports
          $MARKER_FILTER (pytest -m expression), $JUNIT, $LG_ENV (path
          to the rendered env yaml), $LG_COORDINATOR, $LG_PLACE,
          $VENV_DIR.
      artifact_glob:
        type: string
        required: false
        default: |
          **/*.log
          uart_log_*.txt
          junit-hw-*.xml
      timeout_minutes:
        type: number
        required: false
        default: 40
      place_wait_minutes:
        type: number
        required: false
        default: 30
      prism_upload:
        type: boolean
        required: false
        default: false
      prism_url:
        type: string
        required: false
        default: ""
      prism_project:
        type: string
        required: false
        default: ""
      coordinator_runner_label:
        type: string
        required: false
        default: "hw-coordinator"
        description: >-
          Extra label the coordinator-adjacent runner must carry
          (alongside `self-hosted`). Used by the `discover` and
          `summary` jobs that talk to the coordinator REST API. Each
          `hw` shard pins to `hw-<place>` automatically — set up one
          self-hosted runner per place with that label convention.

    secrets:
      PYADI_BUILD_TOKEN:
        required: false
      PRISM_API_TOKEN:
        required: false

env:
  COORDINATOR: ${{ inputs.coordinator != '' && inputs.coordinator || vars.ADI_LG_COORDINATOR }}
  PRISM_URL_RESOLVED: ${{ inputs.prism_url != '' && inputs.prism_url || vars.PRISM_URL }}

jobs:
  # 1) Discover: pull live places from the coordinator, harvest
  #    markers from the caller's tests, intersect, emit a matrix.
  discover:
    runs-on: [self-hosted, "${{ inputs.coordinator_runner_label }}"]
    timeout-minutes: 6
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4

      - name: Setup uv venv
        uses: tfcollins/labgrid-plugins/.github/actions/setup-uv-venv@main
        env:
          PYADI_BUILD_TOKEN: ${{ secrets.PYADI_BUILD_TOKEN }}
        with:
          venv_dir: ${{ inputs.venv_dir }}
          install_cmd: |
            set -euo pipefail
            if [[ -n "${PYADI_BUILD_TOKEN:-}" ]]; then
              export GIT_CONFIG_COUNT=1
              export GIT_CONFIG_KEY_0="url.https://x-access-token:${PYADI_BUILD_TOKEN}@github.com/.insteadOf"
              export GIT_CONFIG_VALUE_0="https://github.com/"
            fi
            ${{ inputs.venv_install_cmd }}

      - name: Discover matrix
        id: discover
        shell: bash --noprofile --norc -eo pipefail {0}
        env:
          LG_COORDINATOR: ${{ env.COORDINATOR }}
        run: |
          VENV_DIR="${{ inputs.venv_dir }}"
          # Resolve $HOME-style expansion (setup-uv-venv already did this,
          # but be explicit for shell idempotency).
          VENV_DIR_EXPANDED=$(eval echo "$VENV_DIR")
          "$VENV_DIR_EXPANDED/bin/adi-lg-hw-ci" discover \
              --coord "$LG_COORDINATOR" \
              --test-root "${{ inputs.test_root }}" \
              --marker "${{ inputs.marker_filter }}" \
              --pytest-bin "$VENV_DIR_EXPANDED/bin/pytest" \
              --github-output

  # 2) HW: one shard per (place, daughter-board) intersection match.
  hw:
    needs: discover
    if: needs.discover.outputs.count != '0' && needs.discover.outputs.count != ''
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.discover.outputs.matrix).include }}
    name: hw (${{ matrix.entry.daughter_board }} on ${{ matrix.entry.carrier }} @ ${{ matrix.entry.place }})
    runs-on: [self-hosted, "hw-${{ matrix.entry.place }}"]
    timeout-minutes: ${{ inputs.timeout_minutes }}
    concurrency:
      # concurrency.group: doesn't support the env context — inline the
      # same resolution as the top-level env.COORDINATOR.
      group: hw-place-${{ inputs.coordinator != '' && inputs.coordinator || vars.ADI_LG_COORDINATOR }}-${{ matrix.entry.place }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv venv
        uses: tfcollins/labgrid-plugins/.github/actions/setup-uv-venv@main
        env:
          PYADI_BUILD_TOKEN: ${{ secrets.PYADI_BUILD_TOKEN }}
        with:
          venv_dir: ${{ inputs.venv_dir }}
          install_cmd: |
            set -euo pipefail
            if [[ -n "${PYADI_BUILD_TOKEN:-}" ]]; then
              export GIT_CONFIG_COUNT=1
              export GIT_CONFIG_KEY_0="url.https://x-access-token:${PYADI_BUILD_TOKEN}@github.com/.insteadOf"
              export GIT_CONFIG_VALUE_0="https://github.com/"
            fi
            ${{ inputs.venv_install_cmd }}

      - name: Render env yaml from place tags
        id: render
        shell: bash --noprofile --norc -eo pipefail {0}
        env:
          LG_COORDINATOR: ${{ env.COORDINATOR }}
        run: |
          VENV_DIR_EXPANDED=$(eval echo "${{ inputs.venv_dir }}")
          OUT_DIR="${{ runner.temp }}/hw-ci-env"
          mkdir -p "$OUT_DIR"
          OUT="$OUT_DIR/env-${{ matrix.entry.place }}.yaml"
          "$VENV_DIR_EXPANDED/bin/adi-lg-hw-ci" render-env \
              --coord "$LG_COORDINATOR" \
              --place "${{ matrix.entry.place }}" \
              --out "$OUT"
          echo "env_path=$OUT" >> "$GITHUB_OUTPUT"
          echo "--- rendered env yaml ---"
          cat "$OUT"

      - name: Acquire coordinator place
        uses: tfcollins/labgrid-plugins/.github/actions/acquire-place@feature/hw-matrix-v2-discovery
        with:
          coordinator: ${{ env.COORDINATOR }}
          place: ${{ matrix.entry.place }}
          labgrid_client: ${{ inputs.venv_dir }}/bin/labgrid-client
          wait_minutes: ${{ inputs.place_wait_minutes }}

      - name: Power-cycle place
        shell: bash --noprofile --norc -eo pipefail {0}
        env:
          LG_COORDINATOR: ${{ env.COORDINATOR }}
          LG_ENV: ${{ steps.render.outputs.env_path }}
          LG_PLACE: ${{ matrix.entry.place }}
        run: |
          VENV_DIR_EXPANDED=$(eval echo "${{ inputs.venv_dir }}")
          LG="$VENV_DIR_EXPANDED/bin/labgrid-client"
          # Just power-cycle. We deliberately do NOT invoke a labgrid Boot*
          # strategy here — those expect specific banners on the serial
          # console within tight timeouts, and the SSH-flavoured ones SSH to
          # the exporter-advertised IP which has been stale in practice
          # (the board's real IP comes from DHCP). For smoke tests we just
          # need the board up, IIOD listening, and we'll discover the real
          # IP from serial in the next step.
          "$LG" -x "$LG_COORDINATOR" -c "$LG_ENV" -p "$LG_PLACE" power cycle

      - name: Resolve board IP from serial + wait for IIOD
        shell: bash --noprofile --norc -eo pipefail {0}
        env:
          LG_COORDINATOR: ${{ env.COORDINATOR }}
          LG_PLACE: ${{ matrix.entry.place }}
          LG_ENV: ${{ steps.render.outputs.env_path }}
        run: |
          # Board was just power-cycled. Wait long enough for ZC706 / ZCU102
          # to come up (~60-120s from cold), then ask the live board what IP
          # DHCP gave it. Login credentials match the Kuiper image defaults;
          # if the board is already at a logged-in shell (warm-boot) the
          # "root" + "analog" inputs become bad commands at the shell prompt
          # — harmless because we parse only the sentinel-delimited block.
          VENV_DIR_EXPANDED=$(eval echo "${{ inputs.venv_dir }}")
          LG="$VENV_DIR_EXPANDED/bin/labgrid-client"
          LOG="${{ runner.temp }}/serial-${LG_PLACE}.log"

          (
              # Wake the console up, then wait for boot to complete.
              echo ""
              sleep 90
              # Send credentials in case we're at the "analog login:" prompt.
              echo "root"
              sleep 2
              echo "analog"
              sleep 5
              # Sentinel-delimited so a shell-prompt-noisy log is unambiguous.
              echo "echo HWCI_IP_START && ip -4 -o addr show eth0 | awk '{print \$4}' | cut -d/ -f1 && echo HWCI_IP_END"
              sleep 5
          ) | timeout 180 "$LG" -x "$LG_COORDINATOR" -c "$LG_ENV" -p "$LG_PLACE" \
              console --logfile "$LOG" 2>&1 | tail -10 || true

          REAL_IP=""
          if [[ -f "$LOG" ]]; then
              REAL_IP=$(sed -n '/HWCI_IP_START/,/HWCI_IP_END/p' "$LOG" \
                  | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' \
                  | head -1)
          fi
          if [[ -z "$REAL_IP" ]]; then
              # Deliberately NO fallback to the coordinator's
              # NetworkService.address. That field is statically configured
              # in the exporter yaml and goes stale across DHCP renewals;
              # using it risks pointing pytest at a different board
              # entirely. Fail loud instead. Common causes for parse
              # failure: `microcom` not installed on the runner (labgrid
              # falls back to `telnet`, which ignores --logfile), or the
              # board didn't reach the login prompt within the wait
              # window.
              echo "::error::could not read eth0 IP from serial console for $LG_PLACE; pytest aborted"
              echo "--- captured serial log ($LOG) ---"
              cat "$LOG" 2>/dev/null || echo "(no log file written — verify microcom is installed on the runner)"
              exit 1
          fi
          echo "Board IP resolved: $REAL_IP"
          echo "Probing $REAL_IP:30431 (iiod) for up to 120s"
          for i in $(seq 1 24); do
              if timeout 3 bash -c "echo > /dev/tcp/$REAL_IP/30431" 2>/dev/null; then
                  echo "iiod reachable at $REAL_IP:30431 after $((i*5))s"
                  break
              fi
              sleep 5
          done
          # Always export the resolved IP — even if the probe timed out, the
          # caller's pytest will surface the real error against the right
          # address (not the stale coordinator one).
          echo "IIO_URI_OVERRIDE=ip:$REAL_IP" >> "$GITHUB_ENV"

      - name: Pre-pytest hook
        if: inputs.pre_pytest_cmd != ''
        run: |
          set -euo pipefail
          ${{ inputs.pre_pytest_cmd }}

      - name: Run hardware tests
        shell: bash --noprofile --norc -eo pipefail {0}
        env:
          MARKER_FILTER: ${{ matrix.entry.marker_filter }}
          LG_ENV: ${{ steps.render.outputs.env_path }}
          LG_COORDINATOR: ${{ env.COORDINATOR }}
          LG_PLACE: ${{ matrix.entry.place }}
          JUNIT: junit-hw-${{ matrix.entry.place }}.xml
          # Consumed by adi_lg_plugins.pytest_plugin.pytest_collection_modifyitems
          # to deselect tests whose iio_hardware / iio_carrier markers don't match
          # this shard's place. The top-level -m expression
          # ("$MARKER_FILTER") only filters on marker NAME; this narrows by ARG.
          HW_DAUGHTER: ${{ matrix.entry.daughter_board }}
          HW_CARRIER: ${{ matrix.entry.carrier }}
        run: |
          VENV_DIR=$(eval echo "${{ inputs.venv_dir }}")
          export VENV_DIR
          ${{ inputs.pytest_cmd_template }}

      - name: Release coordinator place
        if: always()
        shell: bash --noprofile --norc -eo pipefail {0}
        env:
          LG_COORDINATOR: ${{ env.COORDINATOR }}
        run: |
          VENV_DIR_EXPANDED=$(eval echo "${{ inputs.venv_dir }}")
          LG="$VENV_DIR_EXPANDED/bin/labgrid-client"
          if [[ -x "$LG" ]]; then
            "$LG" -x "$LG_COORDINATOR" -p "${{ matrix.entry.place }}" release || true
            "$LG" -x "$LG_COORDINATOR" cancel-reservation --all 2>/dev/null || true
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw-${{ matrix.entry.place }}-${{ matrix.entry.daughter_board }}
          path: ${{ inputs.artifact_glob }}
          if-no-files-found: ignore

      - name: Upload to Prism
        if: always() && inputs.prism_upload && env.PRISM_URL_RESOLVED != ''
        continue-on-error: true
        env:
          PRISM_URL: ${{ env.PRISM_URL_RESOLVED }}
          PRISM_API_TOKEN: ${{ secrets.PRISM_API_TOKEN }}
          PRISM_PROJECT: ${{ inputs.prism_project }}
        run: |
          set -euo pipefail
          : "${PRISM_PROJECT:?PRISM_PROJECT must be set when prism_upload=true}"
          # Same upload script as v1 — TBD wire when v1's helper is split out.
          echo "(Prism upload stub — point at the v1 helper action once factored)"

  # 3) Summary: emit a clear annotation when the intersection is empty.
  summary:
    needs: discover
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print discovery summary
        env:
          COUNT: ${{ needs.discover.outputs.count }}
        run: |
          if [ -z "$COUNT" ] || [ "$COUNT" = "0" ]; then
            echo "::warning::hw-ci discovery produced 0 matrix entries — no marked tests overlap with live coordinator hardware right now"
          else
            echo "::notice::hw-ci discovered $COUNT matrix entries"
          fi
