services:
  coordinator:
    build: ./labgrid-coordinator
    network_mode: host
    volumes:
      - coordinator-data:/var/lib/labgrid
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: coordinator/api/Dockerfile
    network_mode: host
    environment:
      - LG_COORDINATOR_ADDRESS=127.0.0.1:20408
      - LG_OIDC_ISSUER_URL
      - LG_OIDC_CLIENT_ID
      - LG_OIDC_CLIENT_SECRET
      - LG_OIDC_AUTO_PROVISION
      - LG_SESSION_TTL_HOURS
      - LG_SESSION_COOKIE_NAME
      - LG_SESSION_COOKIE_SECURE
      - LG_RECORDINGS_DIR
      - LG_RECORDING_RETENTION_DAYS
      - LG_RECORDING_MAX_BYTES_PER_PLACE
      - LG_DEPLOYMENT_TOKEN
    volumes:
      - api-data:/data
      - ~/.ssh:/etc/ssh-host-keys:ro
    depends_on:
      - coordinator
    restart: unless-stopped

  web:
    build: ./web
    network_mode: host
    depends_on:
      - api
    restart: unless-stopped

volumes:
  coordinator-data:
  api-data:
