# Board catalog served by GET /api/catalog and consumed by GET /api/match.
# Keyed by part (daughter-board / chip). `image` is the default boot image
# when a request omits --bootfile. `carriers` lists the FPGA carriers a part
# is valid on; per-carrier maps are intentionally empty for now and are
# extended with per-surface metadata when those surfaces are built.
# This file is shipped into the API image at /app/board_catalog.yaml (the
# default path). Override the location at runtime via LG_BOARD_CATALOG_PATH.
boards:
  adrv9002:
    # KuiperRelease.release_version (see kuiperdldriver valid_releases).
    # mini2 = ADRV9002 on ZCU102, SD-mux/Kuiper boot (BootFPGASoC).
    image: 2023_R2_P1
    carriers:
      zcu102: {}
  adrv9009:
    # nemo = ADRV9009 on ZC706, JTAG-recovery boot (BootZynq7000JTAGRecovery).
    # The recovery flow is deterministic (JTAG bootstrap + TFTP); `image` is
    # the Kuiper generation flashed to the SD, kept uniform with adrv9002.
    image: 2023_R2_P1
    carriers:
      zc706: {}
  adrv9371:
    # bq = ADRV9371 (the AD9371 eval board; pyadi `adi.ad9371`) on ZC706,
    # JTAG-recovery boot. The place tag and pyadi HW smoke marker are both
    # "adrv9371", so that is the part key (matching is part==daughter-board).
    image: 2023_R2_P1
    carriers:
      zc706: {}
