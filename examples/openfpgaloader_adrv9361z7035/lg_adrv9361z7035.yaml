imports:
  - adi_lg_plugins

targets:
  main:
    resources:
      RemotePlace:
        name: lablp
    drivers:
      HomeAssistantPowerDriver: {}
      OpenFPGALoaderDriver:
        cable: digilent_hs2
        usb_busnum: 1
        usb_devnum: 5
        allow_flash: false
      SerialDriver: {}
      ADIShellDriver:
        prompt: ''
        login_prompt: ''
        username: root
        password: analog
      BootOpenFPGALoader:
        bitstream_path: /path/to/system_top.bit
        boot_marker: Successfully initialized
        boot_timeout: 60
