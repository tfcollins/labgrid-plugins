## Labgrid exporter config for ZCU102 + AD9081
## Converted from lg_ad9081_zcu102.yaml environment config
##
## HW-CI v2 place-tag contract: after this exporter registers, set
## these tags on the resulting place so hw-matrix.yml@v2 can discover it:
##
##   labgrid-client -x $LG_COORDINATOR -p bq set-tags \
##       carrier=zcu102 \
##       daughter-board=ad9081 \
##       boot-strategy=BootFPGASoC
##
## See docs/source/user-guide/hw-ci-v2.md for the full schema.
##
## Usage:
##   labgrid-exporter -c 10.0.0.41:20408 -n bq examples/lg_ad9081_zcu102_exporter.yaml

tlab:
  location: tlab
  NetworkService:
    cls: NetworkService
    address: "10.0.0.23"
    username: "root"
    password: "analog"
  RawSerialPort:
    cls: RawSerialPort
    port: "/dev/ttyUSB0"
    speed: 115200
  USBMassStorage:
    cls: USBMassStorage
    match:
      ID_PATH: "pci-0000:00:14.0-usb-0:1.1:1.0-scsi-0:0:0:0"
      SUBSYSTEM: "block"
  USBSDMuxDevice:
    cls: USBSDMuxDevice
  VesyncOutlet:
    cls: VesyncOutlet
    outlet_names: "Apollo"
    ## Fill in your VeSync account credentials (or point at a local secrets
    ## file via ${LG_VESYNC_USER} / ${LG_VESYNC_PASS} in your tooling).
    username: "REPLACE_ME@example.com"
    password: "REPLACE_ME"
  KuiperRelease:
    cls: KuiperRelease
    release_version: "2023_R2_P1"
    cache_path: "/tmp/kuiper_cache"
    kernel_path: "release:zynqmp-common/Image"
    # The lab's AD9081-FMCB-EBZ has a 122.88 MHz VCXO. Pair the m8_l4
    # bitstream with Kuiper's dedicated DT override, whose HMC7044 node sets
    # adi,vcxo-frequency=122880000. The ordinary m8_l4 and m4_l8 DTBs set
    # 100 MHz and must not be used with this board.
    BOOTBIN_path: "release:zynqmp-zcu102-rev10-ad9081/m8_l4/BOOT.BIN"
    device_tree_path: "release:zynqmp-zcu102-rev10-ad9081/m8_l4/m8_l4_vcxo122p88/system.dtb"
