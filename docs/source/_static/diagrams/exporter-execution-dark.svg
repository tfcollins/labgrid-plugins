<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" role="img" aria-labelledby="title desc"><title id="title">Exporter execution topology</title><desc id="desc">The labgrid client acquires resources through the coordinator, then invokes allowlisted helpers and provider transports on the exporter. The exporter reaches tools and services while the DUT initiates TFTP and exposes console and network endpoints.</desc><defs><marker id="exd-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#aeb4c0"/></marker><marker id="exd-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#ff9364"/></marker><marker id="exd-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#69a7ff"/></marker><style>text{font-family:Inter,system-ui,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.title{fill:#f0f1f3;font-size:22px;font-weight:650}.sub{fill:#aeb4c0;font-size:12px}.tag{fill:#aeb4c0;font-size:8px;letter-spacing:1.2px}.name{fill:#f0f1f3;font-size:14px;font-weight:650}.tech{fill:#aeb4c0;font-size:9px}.label{fill:#aeb4c0;font-size:9px;letter-spacing:.6px}.node{fill:#202228;stroke:#3a3e48;stroke-width:1}.focal{fill:#38261f;stroke:#ff9364;stroke-width:1.2}.zone{fill:#1b1d22;stroke:#3a3e48;stroke-width:.8;stroke-dasharray:5 4}.line{fill:none;stroke:#aeb4c0;stroke-width:1.2}.alink{fill:none;stroke:#69a7ff;stroke-width:1.2}.primary{fill:none;stroke:#ff9364;stroke-width:1.4}.mask{fill:#17181c}</style></defs><rect width="1040" height="420" fill="#17181c"/><text class="title" x="32" y="36">Where each operation actually runs</text><text class="sub" x="32" y="56">Resource discovery is not execution placement — the bound transport decides the path.</text>
<rect class="zone" x="416" y="76" width="320" height="236" rx="8"/><text class="tag mono" x="432" y="96">EXPORTER HOST</text><rect class="zone" x="768" y="76" width="240" height="236" rx="8"/><text class="tag mono" x="784" y="96">BENCH + DUT</text>
