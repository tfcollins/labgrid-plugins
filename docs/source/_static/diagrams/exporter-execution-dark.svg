<rect class="node" x="32" y="124" width="160" height="80" rx="6"/><rect x="40" y="132" width="44" height="16" rx="2" fill="none" stroke="#7f8796" stroke-width=".8"/><text class="tag mono" x="62" y="143" text-anchor="middle">CLIENT</text><text class="name" x="112.0" y="167" text-anchor="middle">Test runner</text><text class="tech mono" x="112.0" y="184" text-anchor="middle">strategy facade</text><rect class="node" x="240" y="124" width="144" height="80" rx="6"/><rect x="248" y="132" width="44" height="16" rx="2" fill="none" stroke="#7f8796" stroke-width=".8"/><text class="tag mono" x="270" y="143" text-anchor="middle">CONTROL</text><text class="name" x="312.0" y="167" text-anchor="middle">Coordinator</text><text class="tech mono" x="312.0" y="184" text-anchor="middle">resources + leases</text><rect class="focal" x="440" y="108" width="256" height="80" rx="6"/><rect x="448" y="116" width="44" height="16" rx="2" fill="none" stroke="#7f8796" stroke-width=".8"/><text class="tag mono" x="470" y="127" text-anchor="middle">FOCAL</text><text class="name" x="568.0" y="151" text-anchor="middle">Driver execution plane</text><text class="tech mono" x="568.0" y="168" text-anchor="middle">AgentWrapper · sshmanager</text><rect class="node" x="440" y="220" width="256" height="80" rx="6"/><rect x="448" y="228" width="44" height="16" rx="2" fill="none" stroke="#7f8796" stroke-width=".8"/><text class="tag mono" x="470" y="239" text-anchor="middle">HOST</text><text class="name" x="568.0" y="263" text-anchor="middle">Tools + credentials</text><text class="tech mono" x="568.0" y="280" text-anchor="middle">xsdb · cache · TFTP · SNMP</text><rect class="node" x="784" y="108" width="208" height="80" rx="6"/><rect x="792" y="116" width="44" height="16" rx="2" fill="none" stroke="#7f8796" stroke-width=".8"/><text class="tag mono" x="814" y="127" text-anchor="middle">EXT</text><text class="name" x="888.0" y="151" text-anchor="middle">LAN / cloud services</text><text class="tech mono" x="888.0" y="168" text-anchor="middle">PDU · HA · Cloudsmith</text><rect class="node" x="784" y="228" width="208" height="80" rx="6"/><rect x="792" y="236" width="44" height="16" rx="2" fill="none" stroke="#7f8796" stroke-width=".8"/><text class="tag mono" x="814" y="247" text-anchor="middle">TARGET</text><text class="name" x="888.0" y="271" text-anchor="middle">Device under test</text><text class="tech mono" x="888.0" y="288" text-anchor="middle">UART · JTAG · Ethernet</text>
<line x1="32" y1="340" x2="1008" y2="340" stroke="#3a3e48"/><text class="tag mono" x="32" y="364">READ THE LINES</text><line class="alink" x1="168" y1="360" x2="204" y2="360" marker-end="url(#exd-link)"/><text class="tech" x="216" y="364">cross-host transport</text><line class="primary" x1="392" y1="360" x2="428" y2="360" marker-end="url(#exd-accent)"/><text class="tech" x="440" y="364">network dependency</text><line class="line" x1="624" y1="360" x2="660" y2="360" marker-end="url(#exd-arrow)"/><text class="tech" x="672" y="364">in-host / provider path</text><text class="tech mono" x="32" y="400">Secrets remain exporter-local. Proxy-required hosts need SSH ProxyJump configuration.</text></svg>