<rect class="node" x="32" y="128" width="184" height="80" rx="6"/><rect x="40" y="136" width="44" height="16" rx="2" fill="none" stroke="#7b8494" stroke-width=".8"/><text class="tag mono" x="62" y="147" text-anchor="middle">SOURCE</text><text class="name" x="124.0" y="171" text-anchor="middle">Kuiper / Cloudsmith</text><text class="tech mono" x="124.0" y="188" text-anchor="middle">release API + CDN</text><rect class="node" x="304" y="128" width="200" height="80" rx="6"/><rect x="312" y="136" width="44" height="16" rx="2" fill="none" stroke="#7b8494" stroke-width=".8"/><text class="tag mono" x="334" y="147" text-anchor="middle">CACHE</text><text class="name" x="404.0" y="171" text-anchor="middle">Download + verify</text><text class="tech mono" x="404.0" y="188" text-anchor="middle">extract · SHA-256</text><rect class="focal" x="592" y="128" width="184" height="80" rx="6"/><rect x="600" y="136" width="44" height="16" rx="2" fill="none" stroke="#7b8494" stroke-width=".8"/><text class="tag mono" x="622" y="147" text-anchor="middle">FOCAL</text><text class="name" x="684.0" y="171" text-anchor="middle">ArtifactRef</text><text class="tech mono" x="684.0" y="188" text-anchor="middle">path · host · digest</text><rect class="node" x="384" y="244" width="176" height="64" rx="6"/><rect x="392" y="252" width="44" height="16" rx="2" fill="none" stroke="#7b8494" stroke-width=".8"/><text class="tag mono" x="414" y="263" text-anchor="middle">JTAG</text><text class="name" x="472.0" y="287" text-anchor="middle">xsdb payload</text><text class="tech mono" x="472.0" y="304" text-anchor="middle">stage or reuse</text><rect class="node" x="596" y="244" width="176" height="64" rx="6"/><rect x="604" y="252" width="44" height="16" rx="2" fill="none" stroke="#7b8494" stroke-width=".8"/><text class="tag mono" x="626" y="263" text-anchor="middle">TFTP</text><text class="name" x="684.0" y="287" text-anchor="middle">Published file</text><text class="tech mono" x="684.0" y="304" text-anchor="middle">atomic rename</text><rect class="node" x="808" y="244" width="176" height="64" rx="6"/><rect x="816" y="252" width="44" height="16" rx="2" fill="none" stroke="#7b8494" stroke-width=".8"/><text class="tag mono" x="838" y="263" text-anchor="middle">STORAGE</text><text class="name" x="896.0" y="287" text-anchor="middle">Mounted media</text><text class="tech mono" x="896.0" y="304" text-anchor="middle">copy_artifact</text>
<line x1="32" y1="340" x2="1008" y2="340" stroke="#d8dadd"/><text class="tag mono" x="32" y="364">PLACEMENT RULE</text><text class="tech" x="168" y="364">Same exporter → pass a verified path. Different host → materialize explicitly.</text><text class="tech mono" x="32" y="400">A path is never assumed to be valid on both the client and exporter.</text></svg>