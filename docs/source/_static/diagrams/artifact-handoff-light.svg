<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" role="img" aria-labelledby="title desc"><title id="title">Location-aware artifact handoff</title><desc id="desc">Kuiper or Cloudsmith artifacts are downloaded and hashed in the exporter cache. Artifact references route same-host files directly to JTAG, TFTP, or mass storage and copy to the client only for legacy path APIs or a consumer on another host.</desc><defs><marker id="arl-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#596579"/></marker><marker id="arl-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#d9562b"/></marker><marker id="arl-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2868b2"/></marker><style>text{font-family:Inter,system-ui,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.title{fill:#252936;font-size:22px;font-weight:650}.sub{fill:#596579;font-size:12px}.tag{fill:#596579;font-size:8px;letter-spacing:1.2px}.name{fill:#252936;font-size:14px;font-weight:650}.tech{fill:#596579;font-size:9px}.label{fill:#596579;font-size:9px;letter-spacing:.6px}.node{fill:#ffffff;stroke:#d8dadd;stroke-width:1}.focal{fill:#fbeae3;stroke:#d9562b;stroke-width:1.2}.zone{fill:#f1f1ee;stroke:#d8dadd;stroke-width:.8;stroke-dasharray:5 4}.line{fill:none;stroke:#596579;stroke-width:1.2}.alink{fill:none;stroke:#2868b2;stroke-width:1.2}.primary{fill:none;stroke:#d9562b;stroke-width:1.4}.mask{fill:#f7f7f5}</style></defs><rect width="1040" height="420" fill="#f7f7f5"/><text class="title" x="32" y="36">Artifacts move only when the consumer requires it</text><text class="sub" x="32" y="56">ArtifactRef carries path, host, size, and SHA-256 provenance across each handoff.</text>
<rect class="zone" x="280" y="76" width="728" height="236" rx="8"/><text class="tag mono" x="296" y="96">EXPORTER FILESYSTEM</text>
<path class="alink" d="M216 168 H304" marker-end="url(#arl-link)"/><path class="primary" d="M504 168 H592" marker-end="url(#arl-accent)"/><path class="line" d="M684 208 V232 H472 V244" marker-end="url(#arl-arrow)"/><path class="line" d="M684 208 V244" marker-end="url(#arl-arrow)"/><path class="line" d="M684 208 V232 H896 V244" marker-end="url(#arl-arrow)"/><path class="alink" stroke-dasharray="5 4" d="M592 148 H548 Q540 148 540 140 V116 Q540 108 524 108 H216" marker-end="url(#arl-link)"/>
