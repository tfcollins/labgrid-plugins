<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 380" role="img" aria-labelledby="title desc"><title id="title">Hardware request workflow</title><desc id="desc">A six-step hardware CI process scans static test markers, matches a live board, reserves a place, boots and verifies the DUT, runs the matching test shard, then releases the place and reports JUnit results.</desc><defs><marker id="hwl-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#596579"/></marker><marker id="hwl-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#d9562b"/></marker><marker id="hwl-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2868b2"/></marker><style>text{font-family:Inter,system-ui,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.title{fill:#252936;font-size:22px;font-weight:650}.sub{fill:#596579;font-size:12px}.tag{fill:#596579;font-size:8px;letter-spacing:1.2px}.name{fill:#252936;font-size:14px;font-weight:650}.tech{fill:#596579;font-size:9px}.label{fill:#596579;font-size:9px;letter-spacing:.6px}.node{fill:#ffffff;stroke:#d8dadd;stroke-width:1}.focal{fill:#fbeae3;stroke:#d9562b;stroke-width:1.2}.zone{fill:#f1f1ee;stroke:#d8dadd;stroke-width:.8;stroke-dasharray:5 4}.line{fill:none;stroke:#596579;stroke-width:1.2}.alink{fill:none;stroke:#2868b2;stroke-width:1.2}.primary{fill:none;stroke:#d9562b;stroke-width:1.4}.mask{fill:#f7f7f5}</style></defs><rect width="1040" height="380" fill="#f7f7f5"/><text class="title" x="24" y="36">One request, one bounded hardware lease</text><text class="sub" x="24" y="56">The consumer names a part; labgrid owns placement, boot verification, and cleanup.</text><line class="line" x1="164" y1="172" x2="176" y2="172" marker-end="url(#hwl-arrow)"/><line class="line" x1="328" y1="172" x2="340" y2="172" marker-end="url(#hwl-arrow)"/><line class="primary" x1="492" y1="172" x2="504" y2="172" marker-end="url(#hwl-accent)"/><line class="line" x1="656" y1="172" x2="668" y2="172" marker-end="url(#hwl-arrow)"/><line class="line" x1="820" y1="172" x2="832" y2="172" marker-end="url(#hwl-arrow)"/><circle cx="94" cy="100" r="12" fill="#d8dadd"/><text class="tag mono" x="94" y="103" text-anchor="middle" fill="#252936">1</text><circle cx="258" cy="100" r="12" fill="#d8dadd"/><text class="tag mono" x="258" y="103" text-anchor="middle" fill="#252936">2</text><circle cx="422" cy="100" r="12" fill="#d8dadd"/><text class="tag mono" x="422" y="103" text-anchor="middle" fill="#252936">3</text><circle cx="586" cy="100" r="12" fill="#d9562b"/><text class="tag mono" x="586" y="103" text-anchor="middle" fill="#f7f7f5">4</text><circle cx="750" cy="100" r="12" fill="#d8dadd"/><text class="tag mono" x="750" y="103" text-anchor="middle" fill="#252936">5</text><circle cx="914" cy="100" r="12" fill="#d8dadd"/><text class="tag mono" x="914" y="103" text-anchor="middle" fill="#252936">6</text><rect class="node" x="24" y="132" width="140" height="80" rx="6"/><rect x="32" y="140" width="44" height="16" rx="2" fill="none" stroke="#7b8494" stroke-width=".8"/><text class="tag mono" x="54" y="151" text-anchor="middle">SCAN</text><text class="name" x="94.0" y="175" text-anchor="middle">Read markers</text><text class="tech mono" x="94.0" y="192" text-anchor="middle">no imports</text><rect class="node" x="188" y="132" width="140" height="80" rx="6"/><rect x="196" y="140" width="44" height="16" rx="2" fill="none" stroke="#7b8494" stroke-width=".8"/><text class="tag mono" x="218" y="151" text-anchor="middle">MATCH</text><text class="name" x="258.0" y="175" text-anchor="middle">Find live board</text><text class="tech mono" x="258.0" y="192" text-anchor="middle">GET /api/match</text><rect class="node" x="352" y="132" width="140" height="80" rx="6"/><rect x="360" y="140" width="44" height="16" rx="2" fill="none" stroke="#7b8494" stroke-width=".8"/><text class="tag mono" x="382" y="151" text-anchor="middle">LEASE</text><text class="name" x="422.0" y="175" text-anchor="middle">Reserve place</text><text class="tech mono" x="422.0" y="192" text-anchor="middle">bounded queue</text><rect class="focal" x="516" y="132" width="140" height="80" rx="6"/><rect x="524" y="140" width="44" height="16" rx="2" fill="none" stroke="#7b8494" stroke-width=".8"/><text class="tag mono" x="546" y="151" text-anchor="middle">BOOT</text><text class="name" x="586.0" y="175" text-anchor="middle">Provision + verify</text><text class="tech mono" x="586.0" y="192" text-anchor="middle">shell → DHCP → iiod</text><rect class="node" x="680" y="132" width="140" height="80" rx="6"/><rect x="688" y="140" width="44" height="16" rx="2" fill="none" stroke="#7b8494" stroke-width=".8"/><text class="tag mono" x="710" y="151" text-anchor="middle">TEST</text><text class="name" x="750.0" y="175" text-anchor="middle">Run shard</text><text class="tech mono" x="750.0" y="192" text-anchor="middle">HW_DAUGHTER</text><rect class="node" x="844" y="132" width="140" height="80" rx="6"/><rect x="852" y="140" width="44" height="16" rx="2" fill="none" stroke="#7b8494" stroke-width=".8"/><text class="tag mono" x="874" y="151" text-anchor="middle">REPORT</text><text class="name" x="914.0" y="175" text-anchor="middle">Release + JUnit</text><text class="tech mono" x="914.0" y="192" text-anchor="middle">always cleanup</text>
<path class="alink" stroke-dasharray="5 4" d="M914 212 V248 Q914 256 906 256 H102 Q94 256 94 248 V220" marker-end="url(#hwl-link)"/><rect class="mask" x="420" y="264" width="184" height="14" rx="2"/><text class="label mono" x="512.0" y="274" text-anchor="middle" fill="#2868b2">JUNIT + RELEASE GUARANTEE</text>
<line x1="24" y1="300" x2="1016" y2="300" stroke="#d8dadd"/><text class="tag mono" x="24" y="324">FAILURE SEMANTICS</text><text class="tech" x="184" y="324">10 no match · 11 busy timeout · 12 boot failure · test exit code otherwise</text><text class="tech mono" x="24" y="356">Ctrl-C, boot failure, and test failure all converge on release.</text></svg>